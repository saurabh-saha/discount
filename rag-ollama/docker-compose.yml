services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      # Keeps pulled models across runs; without it every up re-downloads
      # several gigabytes.
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  rag:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      RAG_EMBED_MODEL: ${RAG_EMBED_MODEL:-nomic-embed-text}
      RAG_CHAT_MODEL: ${RAG_CHAT_MODEL:-llama3.1:8b}
      RAG_INDEX_PATH: /app/data/index.json
    volumes:
      # Drop your own .md/.txt files into rag/corpus and they are indexed
      # on the next run; data/ keeps the built index on the host.
      - ./rag/corpus:/app/rag/corpus
      - ./data:/app/data
    stdin_open: true
    tty: true

volumes:
  ollama-models:
